steps:
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - -c
    - |
      docker build -t northamerica-south1-docker.pkg.dev/microservicios-456418/image-regis/orders-ms -f dockerfile.prod --platform=linux/amd64 --build-arg ORDERS_DATABASE_URL=$$DATABASE_URL .
  secretEnv: ['DATABASE_URL']

- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'push',
      'northamerica-south1-docker.pkg.dev/microservicios-456418/image-regis/orders-ms',
    ]

availableSecrets:
  secretManager:
  - versionName: projects/490197920648/secrets/orders_database_url
    env: 'DATABASE_URL'

options:
  logging: CLOUD_LOGGING_ONLY
